name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # tests read rule commits from the history (tests/test_ghostline.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt -r requirements-score.txt   # the R2 and R5 scorers' pins, so their tests run
      - name: Test (no key; the model APIs are never called)
        run: python -m pytest -q
